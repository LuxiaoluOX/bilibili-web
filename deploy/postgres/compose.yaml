services:
  postgres:
    image: postgres:16-bookworm
    container_name: sjz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sjz-web
      POSTGRES_USER: sjz_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sjz_app -d sjz-web"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256mb
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    name: sjz_postgres_data
